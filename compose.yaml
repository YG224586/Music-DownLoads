services:
  hotdownloader:
    image: ghcr.io/lerdb/hotdownloader:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # 服务对外监听时要求至少 16 个字符；请在本机 .env 中设置随机令牌。
      HOTDOWNLOADER_TOKEN: ${HOTDOWNLOADER_TOKEN:?请先设置 HOTDOWNLOADER_TOKEN}
      HOTDOWNLOADER_DOWNLOAD_DIR: ${HOTDOWNLOADER_DOWNLOAD_DIR:-/downloads}
    volumes:
      - hotdownloader-data:/data
      - ${HOTDOWNLOADER_DOWNLOAD_MOUNT:-hotdownloader-downloads}:${HOTDOWNLOADER_DOWNLOAD_DIR:-/downloads}

volumes:
  hotdownloader-data:
  hotdownloader-downloads:
